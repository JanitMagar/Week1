<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form>
        <h1>User Registration</h1>  
        <fieldset>
            <legend>Personal Details</legend>
            First Name: <input type="text" name="F_Name"><br>
            Last Name: <input type="text"name="L-Name"><br>
            Age: <input type="number"><br>
            Gender: 
            <select>
                <option>Male</option>
                <option>Female</option>
            </select><br>
            Profile Picture: <input type="file">
        </fieldset>
        <fieldset>
            <legend>Account Details</legend><br>
            Email: <input type="email"><br>
            Password: <input type="password"><br>
            Role: <input type="radio">Admin <input type="radio">User
        </fieldset>
        <input type="checkbox">I agree to the terms and conditions <br>
        <button>Register</button> <input type="reset"><br>
        <p>©️2024 My Todo List. All rights reserved</p>
    </form>
</body>
</html>
